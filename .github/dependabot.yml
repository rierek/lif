version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    target-branch: chore/dependabot
    schedule: {interval: weekly}
    groups:
      go: {patterns: ["*"]}
  - package-ecosystem: npm
    directory: /frontend
    target-branch: chore/dependabot
    schedule: {interval: weekly}
    groups:
      frontend: {patterns: ["*"], update-types: [minor, patch]}
      frontend-major: {patterns: ["*"], update-types: [major]}
    ignore:
      # SvelteKit 3.1, svelte-check 4.7 and typescript-eslint 8.71 do not support TS 7 yet (beans-vi9d)
      - {dependency-name: typescript, versions: [">=7"]}
  - package-ecosystem: npm
    directory: /site
    target-branch: chore/dependabot
    schedule: {interval: weekly}
    groups:
      site: {patterns: ["*"]}
  - package-ecosystem: github-actions
    directory: /
    target-branch: chore/dependabot
    schedule: {interval: weekly}
    groups:
      actions: {patterns: ["*"]}
