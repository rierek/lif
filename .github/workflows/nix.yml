name: nix

# flake.nix pins hashes of the pnpm and Go dependency sets; any lockfile change
# without a hash update breaks `nix profile install github:rierek/lif`.
# Fix with `just nix-hashes`.
on:
  push:
    branches: ["main", "milestone/**"]
    paths: &paths
      - flake.nix
      - flake.lock
      - go.mod
      - go.sum
      - frontend/package.json
      - frontend/pnpm-lock.yaml
      - .github/workflows/nix.yml
  pull_request:
    paths: *paths
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Flake version matches the release tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "version = \"${GITHUB_REF_NAME#v}\";" flake.nix || { echo "::error::flake.nix version is not ${GITHUB_REF_NAME#v}; run just nix-hashes ${GITHUB_REF_NAME#v}"; exit 1; }
      - uses: cachix/install-nix-action@v31
      - name: Build flake
        run: nix build -L .#default || { echo "::error::flake build failed; on a hash mismatch run just nix-hashes"; exit 1; }
      - name: Smoke
        run: ./result/bin/lif version && test -x ./result/bin/lif-serve
