# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# vim: set ts=2 sw=2 tw=0 fo=cnqoj

version: 2

project_name: lif

before:
  hooks:
    - go mod download

builds:
  - id: lif
    main: ./cmd/lif
    binary: lif
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X github.com/rierek/lif/internal/version.Version={{.Version}}
      - -X github.com/rierek/lif/internal/version.Commit={{.ShortCommit}}
      - -X github.com/rierek/lif/internal/version.Date={{.Date}}

  - id: lif-serve
    main: ./cmd/lif-serve
    binary: lif-serve
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - windows
      - darwin
    ldflags:
      - -s -w
      - -X github.com/rierek/lif/internal/version.Version={{.Version}}
      - -X github.com/rierek/lif/internal/version.Commit={{.ShortCommit}}
      - -X github.com/rierek/lif/internal/version.Date={{.Date}}

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: lif
    binaries:
      - lif
      - lif-serve
    repository:
      owner: rierek
      name: homebrew-lif
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/rierek/lif"
    description: "Agentic-first issue tracker"
    license: "Apache-2.0"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lif"]
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lif-serve"]
          end

changelog:
  sort: asc
  use: github
  filters:
    include:
      - "^feat"
      - "^fix"
      - "^perf"
      - "^refactor"
  groups:
    - title: "⚠️ Breaking Changes"
      regexp: "!:"
      order: 0
    - title: Features
      regexp: "^feat"
      order: 1
    - title: Bug Fixes
      regexp: "^fix"
      order: 2
    - title: Performance
      regexp: "^perf"
      order: 3
    - title: Other
      order: 999

release:
  github:
    owner: rierek
    name: lif
  footer: >-

    ---

    Released by [GoReleaser](https://github.com/goreleaser/goreleaser).
