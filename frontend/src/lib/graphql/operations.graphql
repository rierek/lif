# =============================================================================
# Fragments
# =============================================================================

fragment ItemFields on Item {
  id
  slug
  path
  title
  status
  type
  priority
  tags
  createdAt
  updatedAt
  body
  order
  parentId
  blockingIds
  worktreeId
}

fragment WorktreeFields on Worktree {
  id
  name
  description
  branch
  path
  items {
    id
  }
  setupStatus
  setupError
  pullRequest {
    number
    title
    state
    url
    isDraft
    checkStatus
    reviewApproved
    mergeable
  }
}

fragment AgentSessionFields on AgentSession {
  itemId
  agentType
  status
  messages {
    role
    content
    images {
      url
      mediaType
    }
    attachments
    diff
  }
  error
  effort
  planMode
  actMode
  systemStatus
  pendingInteraction {
    type
    planContent
    questions {
      header
      question
      multiSelect
      options {
        label
        description
      }
    }
  }
  workDir
  subagentActivities {
    taskId
    index
    description
    currentTool
  }
  quickReplies
}

fragment FileChangeFields on FileChange {
  path
  status
  additions
  deletions
  staged
}

fragment AgentActionFields on AgentAction {
  id
  label
  description
  disabled
  disabledReason
}

# =============================================================================
# Subscriptions
# =============================================================================

subscription ItemChanged($includeInitial: Boolean!) {
  itemChanged(includeInitial: $includeInitial) {
    type
    itemId
    item {
      ...ItemFields
    }
    items {
      ...ItemFields
    }
  }
}

subscription WorktreesChanged {
  worktreesChanged {
    ...WorktreeFields
  }
}

subscription AgentSessionChanged($itemId: ID!) {
  agentSessionChanged(itemId: $itemId) {
    ...AgentSessionFields
  }
}

subscription ActiveAgentStatuses {
  activeAgentStatuses {
    itemId
    status
  }
}

subscription WorkspaceStatuses {
  workspaceStatuses {
    id
    hasChanges
    hasUnmergedCommits
  }
}

# =============================================================================
# Queries
# =============================================================================

query Config {
  projectName
  mainBranch
  agentEnabled
  worktreeBaseRef
  worktreeRunCommand
  worktreeIntegrateMode
  theme
  statuses {
    name
    color
  }
  types {
    name
    color
  }
  priorities {
    name
    color
  }
}

query Worktrees {
  worktrees {
    id
    hasChanges
    hasUnmergedCommits
  }
}

query FileChanges($path: String) {
  fileChanges(path: $path) {
    ...FileChangeFields
  }
}

query AllFileChanges($path: String) {
  allFileChanges(path: $path) {
    ...FileChangeFields
  }
}

query BranchStatus($path: String) {
  branchStatus(path: $path) {
    commitsBehind
    hasConflicts
  }
}

query AgentActions($itemId: ID!, $skipForge: Boolean) {
  agentActions(itemId: $itemId, skipForge: $skipForge) {
    ...AgentActionFields
  }
}

query FileDiff($filePath: String!, $staged: Boolean!, $path: String) {
  fileDiff(filePath: $filePath, staged: $staged, path: $path)
}

query AllFileDiff($filePath: String!, $path: String) {
  allFileDiff(filePath: $filePath, path: $path)
}


# =============================================================================
# Mutations
# =============================================================================

mutation CreateItem($input: CreateItemInput!) {
  createItem(input: $input) {
    ...ItemFields
  }
}

mutation UpdateItem($id: ID!, $input: UpdateItemInput!) {
  updateItem(id: $id, input: $input) {
    ...ItemFields
  }
}

mutation UpdateItemStatus($id: ID!, $input: UpdateItemInput!) {
  updateItem(id: $id, input: $input) {
    id
    status
  }
}

mutation UpdateItemOrder($id: ID!, $input: UpdateItemInput!) {
  updateItem(id: $id, input: $input) {
    id
    status
    order
    parentId
  }
}

mutation DeleteItem($id: ID!) {
  deleteItem(id: $id)
}

mutation ArchiveItem($id: ID!) {
  archiveItem(id: $id)
}

mutation CreateWorktree($name: String!) {
  createWorktree(name: $name) {
    ...WorktreeFields
  }
}

mutation RemoveWorktree($id: ID!) {
  removeWorktree(id: $id)
}

mutation SendAgentMessage($itemId: ID!, $message: String!, $images: [ImageInput!], $attachments: [FileAttachmentInput!]) {
  sendAgentMessage(itemId: $itemId, message: $message, images: $images, attachments: $attachments)
}

query ListFiles($workspaceId: ID, $prefix: String!, $limit: Int) {
  listFiles(workspaceId: $workspaceId, prefix: $prefix, limit: $limit) {
    path
  }
}

mutation StopAgent($itemId: ID!) {
  stopAgent(itemId: $itemId)
}

mutation SetAgentPlanMode($itemId: ID!, $planMode: Boolean!) {
  setAgentPlanMode(itemId: $itemId, planMode: $planMode)
}

mutation SetAgentActMode($itemId: ID!, $actMode: Boolean!) {
  setAgentActMode(itemId: $itemId, actMode: $actMode)
}

mutation SetAgentEffort($itemId: ID!, $effort: String!) {
  setAgentEffort(itemId: $itemId, effort: $effort)
}

mutation ClearAgentSession($itemId: ID!) {
  clearAgentSession(itemId: $itemId)
}

mutation ExecuteAgentAction($itemId: ID!, $actionId: ID!) {
  executeAgentAction(itemId: $itemId, actionId: $actionId)
}

mutation WriteTerminalInput($sessionId: String!, $data: String!) {
  writeTerminalInput(sessionId: $sessionId, data: $data)
}

mutation DiscardFileChange($filePath: String!, $staged: Boolean!, $path: String) {
  discardFileChange(filePath: $filePath, staged: $staged, path: $path)
}

mutation OpenInEditor($workspaceId: ID!) {
  openInEditor(workspaceId: $workspaceId)
}

mutation StartRun($workspaceId: ID!) {
  startRun(workspaceId: $workspaceId)
}

mutation StopRun($workspaceId: ID!) {
  stopRun(workspaceId: $workspaceId)
}

query IsRunning($workspaceId: ID!) {
  isRunning(workspaceId: $workspaceId)
}

query WorkspacePort($workspaceId: ID!) {
  workspacePort(workspaceId: $workspaceId)
}
