# gqlgen configuration
# See https://gqlgen.com/config/ for details

schema:
  - internal/graph/*.graphqls

exec:
  filename: internal/graph/generated.go
  package: graph

model:
  filename: pkg/itemgraph/model/models_gen.go
  package: model

resolver:
  layout: follow-schema
  dir: internal/graph
  package: graph

# Autobind to existing types
autobind:
  - github.com/rierek/lif/pkg/item

models:
  # Bind schema type Item to the item package's Item type
  Item:
    model: github.com/rierek/lif/pkg/item.Item
  # Map the custom Map scalar to gqlgen's built-in map type
  Map:
    model: github.com/99designs/gqlgen/graphql.Map
  # Map ID scalar to string
  ID:
    model:
      - github.com/99designs/gqlgen/graphql.ID
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
  Int:
    model:
      - github.com/99designs/gqlgen/graphql.Int
      - github.com/99designs/gqlgen/graphql.Int64
      - github.com/99designs/gqlgen/graphql.Int32
