[tools]
go = "1.26"  # keep in step with go.mod; Go 1.27 needs golang.org/x/tools >= v0.52 for gqlgen
node = "latest"
pnpm = "latest"
svu = "latest"
watchexec = "latest"

[hooks]
postinstall = "npx corepack enable"

[tasks.setup]
description = "Set up the project (install all dependencies, generate code)"
depends = ["deps", "codegen"]

[tasks.deps]
description = "Install all dependencies"
run = { tasks = ["deps:backend", "deps:frontend"] }

[tasks."deps:backend"]
description = "Install backend dependencies"
run = "go mod download"

[tasks."deps:frontend"]
description = "Install frontend dependencies"
dir = "frontend"
run = "pnpm install"

[tasks.codegen]
run = ["go generate ./...", "cd frontend && pnpm codegen"]

[tasks."test:zsh"]
description = "Assert the zsh pick widget mutates LBUFFER and forwards context"
run = "bash scripts/test-zsh-widget.sh"

[tasks.test]
depends = ["codegen", "test:e2e", "test:zsh"]
run = "go test -count=1 ./..."

[tasks."build:frontend"]
description = "Build the SvelteKit frontend"
dir = "frontend"
depends = "codegen"
run = "pnpm build"

[tasks."build:embed"]
description = "Copy frontend build to embed directory"
depends = "build:frontend"
run = """
rm -rf internal/web/dist
mkdir -p internal/web/dist
cp -r frontend/build/* internal/web/dist/
touch internal/web/dist/.gitkeep
"""

[tasks.build]
depends = ["codegen", "build:embed"]
run = """
GIT_DIR=$(git rev-parse --git-dir 2>/dev/null || echo "")
GIT_COMMON_DIR=$(git rev-parse --git-common-dir 2>/dev/null || echo "")
TREE_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || echo "")
TREE_KIND=""
if [ -n "$TREE_ROOT" ]; then
  if [ "$GIT_DIR" = "$GIT_COMMON_DIR" ]; then
    TREE_KIND="main"
  else
    TREE_KIND="worktree"
  fi
fi
LDFLAGS="\
  -X github.com/xRiErOS/lif/internal/version.Version=$(git describe --tags --always --dirty 2>/dev/null || echo dev) \
  -X github.com/xRiErOS/lif/internal/version.Commit=$(git rev-parse --short HEAD 2>/dev/null || echo unknown) \
  -X github.com/xRiErOS/lif/internal/version.Date=$(date -u +%Y-%m-%dT%H:%M:%SZ) \
  -X github.com/xRiErOS/lif/internal/version.Tree=$TREE_ROOT \
  -X github.com/xRiErOS/lif/internal/version.TreeKind=$TREE_KIND"
go build -ldflags "$LDFLAGS" -o lif ./cmd/lif
go build -ldflags "$LDFLAGS" -o lif-serve ./cmd/lif-serve
"""

[tasks.lif]
description = "Build and run the lif CLI"
run = "go run ./cmd/lif"

[tasks.lif-serve]
description = "Build and run the lif-serve server"
run = "go build -o /tmp/lif-serve-dev ./cmd/lif-serve && /tmp/lif-serve-dev --port ${LIF_PORT:-22880}"
sources = ["**/*.go"]

[tasks.install]
depends = "build"
run = """
cp lif ~/.local/bin/lif
cp lif-serve ~/.local/bin/lif-serve
"""

[tasks."release:patch"]
description = "Create a patch version tag (e.g., v0.1.4 → v0.1.5)"
run = """
set -e
NEW_VERSION=$(svu patch)
git tag -a "$NEW_VERSION" -m "$NEW_VERSION"
echo "Created annotated tag: $NEW_VERSION"
echo "Push: git push && git push <remote> $NEW_VERSION (oder 'git tag -d $NEW_VERSION' zum Rueckgaengigmachen)."
"""

[tasks."release:minor"]
description = "Create a minor version tag (e.g., v0.1.4 → v0.2.0)"
run = """
set -e
NEW_VERSION=$(svu minor)
git tag -a "$NEW_VERSION" -m "$NEW_VERSION"
echo "Created annotated tag: $NEW_VERSION"
echo "Push: git push && git push <remote> $NEW_VERSION (oder 'git tag -d $NEW_VERSION' zum Rueckgaengigmachen)."
"""

[tasks."release:major"]
description = "Create a major version tag (e.g., v0.1.4 → v1.0.0)"
run = """
set -e
NEW_VERSION=$(svu major)
git tag -a "$NEW_VERSION" -m "$NEW_VERSION"
echo "Created annotated tag: $NEW_VERSION"
echo "Push: git push && git push <remote> $NEW_VERSION (oder 'git tag -d $NEW_VERSION' zum Rueckgaengigmachen)."
"""


[tasks."test:e2e"]
description = "Run Playwright e2e tests"
depends = "build:embed"
dir = "frontend"
run = "pnpm test:e2e"

[tasks."dev:serve"]
run = "mise watch lif-serve --restart"

[tasks."dev:frontend"]
dir = "frontend"
run = "pnpm dev --port ${VITE_PORT:-5173}"

[tasks.dev]
description = "Run the development server"
depends = "setup"
run = { tasks = ["dev:serve", "dev:frontend"] }

[tasks."dev:kill"]
description = "Kill any lingering dev processes"
run = """
pkill -9 -f "lif-serve" 2>/dev/null && echo "Killed lif-serve processes" || echo "No lif-serve processes"
pkill -9 -f "wgo.*beans" 2>/dev/null && echo "Killed wgo processes" || echo "No wgo processes"
"""
